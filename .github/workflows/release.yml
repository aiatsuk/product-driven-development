name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.5.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check versions and changelog
        run: python3 scripts/release.py check --tag "$TAG"

      - name: Run tests
        run: |
          python3 -B -m unittest discover -s tests -p 'test_*.py' -v
          python3 -B -m unittest discover -s skills/product-driven-development/tests -p 'test_*.py' -v
          python3 -B scripts/public_check.py

      - name: Write release notes
        run: python3 scripts/release.py notes --tag "$TAG" > notes.md

      - name: Publish GitHub Release
        run: |
          VERSION="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Product Driven Development ${VERSION}" --notes-file notes.md
          else
            gh release create "$TAG" --verify-tag --title "Product Driven Development ${VERSION}" --notes-file notes.md
          fi
